# 2 GB is tight for Compose + KSP and shows up as slow syncs and OOM-ish stalls in
# Android Studio. 4 GB is comfortable on any machine that can run the IDE at all.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Reuses task outputs across builds and branches — the single biggest win on repeat
# builds, which is most of them during development.
org.gradle.caching=true
