# 180 -> 181 on 10 Sep 2026, when the checkers began reading androidTest, debug and
# sharedTest. This counts calls the checker DECLINES to judge, not defects: the defect
# count is separate and is 0. One more blind spot became visible; none was created.
# 181 -> 178 on the UX batch-A merge: three mixed call sites became fully named.
# 182 -> 181 in W2a: NumeralWell's compact branch (its `Kicker(label, asHeading = false)`) went
# with SetEntryPanel's unused compact path.
required_args_mixed = 181
required_args_lambda = 46
when_exhaustive = 47
# Call sites check-lambda-arity declines rather than guesses at: a lambda header that does
# not parse as a parameter list, a declaration whose parameter is not a plain function type
# (a receiver type `T.(A) -> R` among them), and a fully-qualified call, which the call-site
# regex cannot see because its lookbehind excludes a leading dot — the price of not judging
# `vm.method(...)` against a same-named top-level declaration. Ratchet down; a rise means a
# new blind spot, not new code. 61 on trunk alone; 62 with batch A, whose one extra site is a
# fully-qualified call. The defect count is 0 either way.
# F1: 18 annotated Compose slots now checked; one isolated test-store factory added.
# Net reduction from the accepted ceiling of 62. Receiver slots remain out of scope.
# 47 -> 46 in W2a, measured after the dead code went.
lambda_arity_declined = 46
# ViewModel-flow `first { }` waits in *ViewModelTest.kt with no withTimeout around
# them. Each is a wedge, not a failure, when the value it waits for is overwritten
# (9 Sep 2026, twice). Ratchet down class by class.
unbounded_waits = 0
# `catch (Exception)` inside a suspend fun or a coroutine builder's lambda with no
# CancellationException clause ahead of it: it eats the cancellation and carries on.
cancellation_swallow = 0

