name: Walkthrough screens

# VS1: emulator PNG walkthrough for visual review on every PR and trunk push.
# Failing instrumented flows fail this job; visual diff vs trunk is report-only.

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read
  actions: read

concurrency:
  group: walkthrough-screens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  walkthrough-screens:
    name: Emulator walkthrough screens
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/trunk' }}

      - name: Make scripts executable
        run: chmod +x ./gradlew ./tools/emulator-ux-walkthrough.sh

      - name: Build debug and androidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-configuration-cache

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          UX_WALKTHROUGH_FLOWS: '1-9'
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -timezone America/Toronto
          script: ./tools/emulator-ux-walkthrough.sh

      - name: Build walkthrough index
        if: always()
        run: python3 tools/walkthrough-build-index.py walkthrough-screens

      - name: Install Pillow for visual diff
        if: always()
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Visual diff against trunk baseline
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/walkthrough-diff-trunk.py walkthrough-screens >> "$GITHUB_STEP_SUMMARY"

      - name: Upload walkthrough screens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walkthrough-screens
          path: walkthrough-screens/
          retention-days: 14
          if-no-files-found: warn
