name: Release

# OPTIONAL convenience, not the deployment path. Android Studio (Build → Generate
# Signed App Bundle / APK, or the local assembleRelease in SETUP.md) stays the
# primary way this app reaches the phone.
#
# This exists so a versioned APK can be produced without a specific laptop being
# alive, and so the release that lands on GitHub is provably signed and verified.
# If the signing secrets are not configured it still runs and publishes an UNSIGNED
# APK clearly marked as such, rather than failing every tag.
#
# Required repository secrets for a signed release (Settings → Secrets → Actions):
#   KEYSTORE_BASE64       base64 of your .keystore file
#   KEYSTORE_PASSWORD     store password
#   KEY_ALIAS             key alias (e.g. personaltrainer)
#   KEY_PASSWORD          key password
#
# Produce KEYSTORE_BASE64 with:
#   base64 -w0 release/personal-trainer-release.keystore     # Linux
#   base64 -i release/personal-trainer-release.keystore      # macOS
#
# NOTE: GitHub secrets are write-only. This is NOT a keystore backup — see
# docs/RECOVERY.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A tag must never ship code whose tests fail.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Reconstructs exactly what SETUP.md describes doing locally: a keystore file
      # plus keystore.properties, which app/build.gradle.kts already reads.
      - name: Restore signing config
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p release
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release/ci-release.keystore
          cat > keystore.properties <<EOF
          storeFile=release/ci-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      # Proves the artifact is actually signed by the expected key before anyone
      # tries to install it over an existing app.
      - name: Verify signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs --verbose "${{ steps.apk.outputs.path }}"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties release/ci-release.keystore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            notes="Signed release APK. Install directly, or let Obtainium pick it up."
          else
            notes="**UNSIGNED** — signing secrets are not configured, so this APK cannot update an existing install. Build locally per SETUP.md, or add the KEYSTORE_* secrets."
          fi
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --title "$tag" \
            --notes "$notes" \
            --verify-tag || \
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
