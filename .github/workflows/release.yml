name: Release

# OPTIONAL convenience for a signed gym-floor APK. Obtainium is the phone
# path: Temper Debug from a debug-live pre-release, gym-floor Temper from a
# signed PersonalTrainer-<version>.apk. Android Studio is not the install path.
#
# This exists so a versioned APK can be produced without a specific laptop being alive,
# and so what lands on GitHub is provably signed. Every run uploads the APK as a workflow
# artifact; a GitHub Release is published only when the run was triggered by a tag.
#
# Without the signing secrets it still builds and still uploads — an UNSIGNED APK, clearly
# marked. An unsigned APK cannot update an existing install, but it is better than a red
# tag and a discarded build.
#
# Repository secrets for a signed release (Settings → Secrets and variables → Actions).
# ALL FOUR are required; a partial set is treated as unconfigured:
#   KEYSTORE_BASE64    base64 of your .keystore file
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias (e.g. personaltrainer)
#   KEY_PASSWORD       key password
#
# Produce KEYSTORE_BASE64 with:
#   base64 -w0 release/personal-trainer-release.keystore     # Linux
#   base64 -i release/personal-trainer-release.keystore      # macOS
#
# NOTE: GitHub secrets are write-only. This is NOT a keystore backup — see
# docs/RECOVERY.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # All four, not just the keystore: a half-configured set otherwise enters the signing
      # path with an empty alias and dies inside AGP looking like a corrupt keystore.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Static checks (tools/preflight.sh)
        run: PT_STATIC_ONLY=1 sh tools/preflight.sh

      # The version is hand-maintained in app/build.gradle.kts (SETUP.md §1). Tagging
      # without bumping it publishes a green, correctly-signed release whose versionCode
      # never increased — Obtainium ignores it and the phone refuses to install it. That
      # failure is invisible in every log and only shows up on the device, so catch it here.
      - name: Tag must match the built version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          build_version="$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ -z "$build_version" ]; then
            echo "Could not read appVersionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$tag_version" != "$build_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appVersionName=$build_version." >&2
            echo "Bump appVersionCode and appVersionName in app/build.gradle.kts, or retag." >&2
            exit 1
          fi
          # One rule with tools/check-version-code.py: first v* may equal 1;
          # later v* must be strictly above the previous v* tag's appVersionCode.
          # Exclude this tag so a tag push does not compare against itself.
          # There is no v* tag yet; until the first one, the file floor stays 1.
          python3 tools/check-version-code.py --tag-release --exclude-tag "$GITHUB_REF_NAME"
          echo "version=$build_version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Reconstructs exactly what SETUP.md describes doing locally: a keystore file plus
      # keystore.properties, which app/build.gradle.kts already reads.
      #
      # Secrets go through env, never through ${{ }} inside run: an unquoted heredoc would
      # let bash expand a password containing $, backticks or $(...) — silently writing the
      # wrong password, or executing part of it. Backslashes are then escaped because
      # java.util.Properties treats them as escapes too.
      - name: Restore signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release/ci-release.keystore
          if [ ! -s release/ci-release.keystore ]; then
            echo "KEYSTORE_BASE64 decoded to an empty file — re-copy the secret." >&2
            exit 1
          fi
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf 'storeFile=release/ci-release.keystore\n'
            printf 'storePassword=%s\n' "$(esc "$KEYSTORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$(esc "$KEY_ALIAS")"
            printf 'keyPassword=%s\n' "$(esc "$KEY_PASSWORD")"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # mapping.txt is the only way to read a minified crash bundle:
      # DiagnosticRedaction keeps Temper frames by package prefix, and R8
      # renames the rest. Upload even on workflow_dispatch so a mapping is
      # not thrown away with the APK.
      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      # Three candidates in preference order. Unsigned MUST be last but MUST be reachable:
      # with no keystore, AGP emits only PersonalTrainer-<version>-release-unsigned.apk and
      # the build script's rename skips it, so excluding "unsigned" outright made the whole
      # no-secrets path dead code. When signed, two APKs exist (AGP's -release.apk and the
      # version-only copy); SETUP.md §5 says ship the version-only one, so pick it
      # deterministically rather than whatever the filesystem lists first.
      - name: Locate APK
        id: apk
        run: |
          dir=app/build/outputs/apk/release
          apk=$(find "$dir" -maxdepth 1 -name 'PersonalTrainer-*.apk' \
                  ! -name '*-release.apk' ! -name '*unsigned*' | sort | head -1)
          [ -n "$apk" ] || apk=$(find "$dir" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | sort | head -1)
          [ -n "$apk" ] || apk=$(find "$dir" -maxdepth 1 -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "Selected $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      # Proves the artifact really is signed by the expected key before anything tries to
      # install it over an existing app.
      - name: Verify signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          "$apksigner" verify --print-certs --verbose "${{ steps.apk.outputs.path }}"

      # Always keep the build, even on workflow_dispatch where no Release is published —
      # otherwise a manual run spends 15 minutes and throws the APK away.
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # Passwords also land in the project-local configuration cache, not just in the two
      # files, because the serialized task graph includes the signing config.
      - name: Remove signing material
        if: always()
        run: rm -rf keystore.properties release/ci-release.keystore .gradle/configuration-cache

      # Only a tag gets a Release. On workflow_dispatch GITHUB_REF_NAME is a branch, and
      # `gh release create main` would fail after the whole build had already succeeded.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            notes="Signed release APK. Install directly, or let Obtainium pick it up."
          else
            notes="**UNSIGNED** — signing secrets are not configured, so this APK cannot update an existing install. Build locally per SETUP.md, or add the KEYSTORE_* secrets."
          fi
          mapping="app/build/outputs/mapping/release/mapping.txt"
          # A release may already exist because it was cut by hand (SETUP.md §5.3 documents
          # exactly that). Never clobber a human-uploaded APK: attach alongside, and if the
          # asset name already exists, leave it and say so. Same rule for mapping.txt.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading without overwriting."
            gh release upload "$tag" "$APK" || \
              echo "Asset already present on $tag; leaving the existing one untouched."
          else
            gh release create "$tag" "$APK" \
              --title "${tag#v}" \
              --notes "$notes" \
              --verify-tag
          fi
          if [ -f "$mapping" ]; then
            gh release upload "$tag" "$mapping" || \
              echo "mapping.txt already present on $tag; leaving the existing one untouched."
          fi
