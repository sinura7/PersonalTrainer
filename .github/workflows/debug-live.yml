name: Debug live drop

# The Temper Debug phone lane, automated. docs/DEVELOPMENT.md's owner loop says
# a merge is followed by a `debug-live-*` pre-release carrying
# PersonalTrainer-*-debug.apk for Obtainium — but until this file existed the
# only producer of that artifact was a person with an SDK: release.yml triggers
# on `v*` and builds the RELEASE variant, and ci.yml's debug APK is a 14-day
# workflow artifact, not a release asset. Pushing a debug-live tag now builds
# and attaches the APK itself.
#
# Debug is intentionally unsigned-with-release-key: it is the `.debug`
# application id, signed by the debug keystore the runner generates, exactly
# like a local assembleDebug. Gym-floor Temper stays on release.yml.
#
# Like ci.yml, this is written blind until the account has a runner (see
# docs/DEVELOPMENT.md on CI billing). It is the same steps ci.yml runs plus a
# release upload, so the day CI works, this does too.

# Two triggers because this repo's sessions cannot always push tags: the
# remote-session git proxy 403s tag refs while allowing branch pushes. A push
# to a `debug-live/<suffix>` branch is the tag-less spelling — the workflow
# derives the tag name (`debug-live-<suffix>`) and `gh release create` mints
# the tag itself with the Actions token.
# Single-level branch glob: `debug-live/a/b` would mint the tag
# `debug-live-a/b`, escaping the `debug-live-*` name Obtainium filters on.
on:
  push:
    tags: ['debug-live-*']
    branches: ['debug-live/*']
  workflow_dispatch:

permissions:
  contents: write # create the pre-release and attach the APK

jobs:
  drop:
    name: Build and attach the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A drop must never ship code whose tests fail.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name 'PersonalTrainer-*-debug.apk' | sort | head -1)
          [ -n "$apk" ] || apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "No debug APK produced" >&2
            exit 1
          fi
          echo "Selected $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # workflow_dispatch keeps the build as an artifact only.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-live-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A release may already exist because it was cut by hand (that has been the
      # only path so far). Never clobber a hand-uploaded APK: attach alongside,
      # and if the asset name already exists, leave the existing one untouched.
      # Push events only: a workflow_dispatch run from a debug-live/* branch
      # must keep the artifact-only promise above, not publish a release.
      - name: Publish pre-release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || startsWith(github.ref_name, 'debug-live/'))
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            verify="--verify-tag"
          else
            # Branch spelling: debug-live/<suffix> releases as debug-live-<suffix>,
            # tagged at this commit by the release itself.
            tag="debug-live-${GITHUB_REF_NAME#debug-live/}"
            verify="--target $GITHUB_SHA"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading without overwriting."
            gh release upload "$tag" "$APK" || \
              echo "Asset already present on $tag; leaving the existing one untouched."
          else
            gh release create "$tag" "$APK" \
              --title "Temper Debug — $tag" \
              --prerelease \
              --notes "Temper Debug drop. Pull Obtainium on Temper Debug (include pre-releases)." \
              $verify
          fi
