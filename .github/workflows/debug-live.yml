name: Debug live drop

# The Temper Debug phone lane, automated. docs/DEVELOPMENT.md's owner loop says
# a merge is followed by a `debug-live-*` pre-release carrying
# PersonalTrainer-*-debug.apk for Obtainium — but until this file existed the
# only producer of that artifact was a person with an SDK: release.yml triggers
# on `v*` and builds the RELEASE variant, and ci.yml's debug APK is a 14-day
# workflow artifact, not a release asset. Pushing a debug-live tag now builds
# and attaches the APK itself.
#
# Debug is intentionally not signed with the release key: it is the `.debug`
# application id and gym-floor Temper stays on release.yml. It is NOT signed by
# a keystore the runner generates either — Android installs an update only over
# the same signing key, and a fresh runner mints a fresh key every run, so two
# such drops could never update each other and the Drive OAuth client's SHA-1
# stopped matching. One stable debug distribution keystore is restored from
# repository secrets (SETUP.md §6); without the secrets the drop still builds,
# and the pre-release says the APK cannot update an existing install.
#
# Like ci.yml, this is written blind until the account has a runner (see
# docs/DEVELOPMENT.md on CI billing). It is the same steps ci.yml runs plus a
# release upload, so the day CI works, this does too.

# Two triggers because this repo's sessions cannot always push tags: the
# remote-session git proxy 403s tag refs while allowing branch pushes. A push
# to a `debug-live/<suffix>` branch is the tag-less spelling — the workflow
# derives the tag name (`debug-live-<suffix>`) and `gh release create` mints
# the tag itself with the Actions token.
# Single-level branch glob: `debug-live/a/b` would mint the tag
# `debug-live-a/b`, escaping the `debug-live-*` name Obtainium filters on.
on:
  push:
    tags: ['debug-live-*']
    branches: ['debug-live/*']
  workflow_dispatch:

permissions:
  contents: write # create the pre-release and attach the APK

jobs:
  drop:
    name: Build and attach the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Secrets travel through env, never through ${{ }} inside run:, for the
      # reason release.yml gives. Backslashes are escaped because
      # java.util.Properties treats them as escapes. All four or none: a
      # half-configured set would enter the signing path with an empty alias.
      - name: Restore the debug distribution signer
        id: signer
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ] || [ -z "$DEBUG_KEYSTORE_PASSWORD" ] || \
             [ -z "$DEBUG_KEY_ALIAS" ] || [ -z "$DEBUG_KEY_PASSWORD" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEBUG_KEYSTORE_* secrets are not all set. This drop is signed by a key this runner just generated and cannot update an existing Temper Debug install. See SETUP.md §6."
            exit 0
          fi
          mkdir -p debug-signing
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug-signing/ci-debug.keystore
          if [ ! -s debug-signing/ci-debug.keystore ]; then
            echo "DEBUG_KEYSTORE_BASE64 decoded to an empty file — re-copy the secret." >&2
            exit 1
          fi
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf 'storeFile=debug-signing/ci-debug.keystore\n'
            printf 'storePassword=%s\n' "$(esc "$DEBUG_KEYSTORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$(esc "$DEBUG_KEY_ALIAS")"
            printf 'keyPassword=%s\n' "$(esc "$DEBUG_KEY_PASSWORD")"
          } > debug-keystore.properties
          echo "stable=true" >> "$GITHUB_OUTPUT"

      # Before anything is built: is this commit allowed to become a drop at all?
      # The ratchet compares the tree's debugLiveCode against every debug-live-*
      # tag's. Two packets that both bumped to the same number are caught here,
      # with the number to use in the message, rather than by a phone that is
      # never offered the update.
      - name: Drop ratchet (tools/check-debug-live-code.py)
        run: python3 tools/check-debug-live-code.py

      - name: Static checks (tools/preflight.sh)
        run: PT_STATIC_ONLY=1 sh tools/preflight.sh

      # A drop must never ship code whose tests fail.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name 'PersonalTrainer-*-debug.apk' | sort | head -1)
          [ -n "$apk" ] || apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "No debug APK produced" >&2
            exit 1
          fi
          echo "Selected $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Non-secret metadata only: the certificate digest of the APK just built, so
      # the run log names the identity that signed it. With the DEBUG_CERT_SHA256
      # repository variable set (SETUP.md §6), a drop signed by anything else fails
      # here rather than publish an APK the phone will refuse.
      - name: Verify the signer
        env:
          EXPECTED_SHA256: ${{ vars.DEBUG_CERT_SHA256 }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          certs="$("$apksigner" verify --print-certs "$APK")"
          printf '%s\n' "$certs" | grep -i 'SHA-256 digest' || true
          actual="$(printf '%s\n' "$certs" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -n "$EXPECTED_SHA256" ]; then
            expected="$(printf '%s' "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            if [ "$actual" != "$expected" ]; then
              echo "Signer $actual is not DEBUG_CERT_SHA256 $expected — not publishing." >&2
              exit 1
            fi
            echo "Signer matches DEBUG_CERT_SHA256."
          fi

      # The passwords also land in the configuration cache with the signing config.
      - name: Remove signing material
        if: always()
        run: rm -rf debug-keystore.properties debug-signing .gradle/configuration-cache

      # workflow_dispatch keeps the build as an artifact only.
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-live-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A release may already exist because it was cut by hand (that has been the
      # only path so far). Never clobber a hand-uploaded APK: attach alongside,
      # and if the asset name already exists, leave the existing one untouched.
      # Push events only: a workflow_dispatch run from a debug-live/* branch
      # must keep the artifact-only promise above, not publish a release.
      - name: Publish pre-release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || startsWith(github.ref_name, 'debug-live/'))
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          STABLE_SIGNER: ${{ steps.signer.outputs.stable }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Branch spelling: debug-live/<suffix> releases as debug-live-<suffix>.
            tag="debug-live-${GITHUB_REF_NAME#debug-live/}"
          fi
          if [ "$STABLE_SIGNER" = "true" ]; then
            notes="Temper Debug drop, signed with the stable debug distribution key. Pull Obtainium on Temper Debug (include pre-releases)."
          else
            notes="**THROWAWAY SIGNER** — the DEBUG_KEYSTORE_* secrets are not configured, so this APK is signed by a key the runner generated and cannot update an existing Temper Debug install. Set the secrets per SETUP.md §6, or back up, uninstall and reinstall."
          fi

          taken() {
            echo "$1" >&2
            echo "" >&2
            echo "The APK this run built has NOT been released, and nothing was" >&2
            echo "overwritten. Cut the drop again under a free name:" >&2
            echo "" >&2
            echo "  python3 tools/debug-drop-plan.py" >&2
            echo "  git push origin <sha>:refs/heads/debug-live/<the suffix it prints>" >&2
            exit 1
          }

          # A drop is claimed, not assumed.
          #
          # This replaces an upload-if-the-release-exists path that swallowed its
          # own failure. On 10 Sep 2026 a run built #218, found
          # debug-live-2026-09-10-6 already published from #217, could not attach
          # an asset of the same name, printed a line about leaving the existing
          # one untouched, and went green — a drop that carried the previous
          # packet's APK under this packet's name. A publish that cannot publish
          # now fails the job.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag is the trigger, so it exists by definition; the release is
            # what must not.
            if gh release view "$tag" >/dev/null 2>&1; then
              taken "$tag is already released — refusing to publish over it."
            fi
          else
            # Creating a ref is atomic: GitHub refuses one that exists. Two runs
            # racing for a name cannot both win, and a branch pushed forward onto
            # a spent name stops here instead of landing on someone else's release.
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                   -f ref="refs/tags/$tag" \
                   -f sha="$GITHUB_SHA" >/dev/null 2>claim.err; then
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                taken "$tag is already taken — refusing to publish over it."
              fi
              echo "Claiming $tag failed and the tag does not exist:" >&2
              cat claim.err >&2
              exit 1
            fi
          fi

          # --verify-tag, always: the tag is either the trigger or the one just
          # claimed at this commit, so the release cannot be built around a name
          # that points somewhere else.
          gh release create "$tag" "$APK" \
            --title "Temper Debug — $tag" \
            --prerelease \
            --notes "$notes" \
            --verify-tag
