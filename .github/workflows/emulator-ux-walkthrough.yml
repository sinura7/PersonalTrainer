name: Emulator UX walkthrough

# Manual UX capture lane only. Does not publish APKs, tags, or releases.
# workflow_dispatch only resolves from the default branch; this branch uses push
# on tools/emulator-ux-walkthrough to start runs without merging to trunk.
on:
  workflow_dispatch:
  push:
    branches: [tools/emulator-ux-walkthrough]

permissions:
  contents: read

jobs:
  ux-walkthrough:
    name: UX walkthrough (${{ matrix.flows }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flows: "1-3"
            artifact: ux-walkthrough-flows-1-3
          - flows: "4-6"
            artifact: ux-walkthrough-flows-4-6
          - flows: "7-9"
            artifact: ux-walkthrough-flows-7-9

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Make walkthrough script executable
        run: chmod +x ./tools/emulator-ux-walkthrough.sh

      # Parallel matrix jobs race on a cold configuration cache; one shard can fail
      # storing :app:mergeReleaseNativeLibs and surface a bogus gotrue-kt-android miss
      # while Maven Central has the artifact (see run 39006918648 job 7-9).
      - name: Build debug and androidTest APKs
        run: |
          set -eu
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Gradle build attempt ${attempt}/${max_attempts}"
            extra_args=""
            if [ "$attempt" -gt 1 ]; then
              extra_args="--refresh-dependencies"
              sleep $((attempt * 15))
            fi
            if ./gradlew assembleDebug assembleDebugAndroidTest \
              --stacktrace \
              --no-configuration-cache \
              $extra_args; then
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          exit 1

      - name: Instrumented UX walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_WALKTHROUGH_FLOWS: ${{ matrix.flows }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          cores: 4
          # Warm/quick boot (omit -no-snapshot); extra RAM and cores reduce IME and navigation flake.
          emulator-options: -memory 6144 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./tools/emulator-ux-walkthrough.sh

      - name: Upload UX walkthrough artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ux-walkthrough/
          retention-days: 14
          if-no-files-found: warn
