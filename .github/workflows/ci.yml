name: CI

# The safety net. Cursor JVM-gates; Obtainium is the phone. This exists so a
# broken commit is caught by something other than memory.
# (A unit test in this repo sat red from the day it was written because nothing ran it.)

on:
  push:
    # Feature branches are included on purpose. Work is pushed here from environments
    # that have no Android SDK and cannot reach Google's Maven, so the branch build is
    # the only thing that ever compiles that code — verifying it only once it reaches
    # trunk would mean reviewing it blind right up to the merge.
    branches: [trunk, 'claude/**', 'cursor/**']
  pull_request:
  workflow_dispatch:

# Read-only: this job only needs the source and the ability to upload artifacts.
# Without this the token inherits the repo default, which may still be read-write-all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is fine. Superseding a push to trunk is NOT — that commit would
  # then never be verified, which is the exact hole this workflow exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/trunk' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The same static gate preflight runs locally (20 checkers, 4 fixture proofs,
      # named-args, syntax). PT_STATIC_ONLY skips its JVM test step — Gradle runs the full
      # suite next — so the checker list lives in exactly one place.
      - name: Static checks (tools/preflight.sh)
        run: PT_STATIC_ONLY=1 sh tools/preflight.sh

      # Wrapped, not bare: a run of this step once sat wedged for 31m10s and was
      # killed by the job's timeout-minutes. A cancelled job skips its `if: always()`
      # steps, so that half hour uploaded nothing at all — no report, no per-class
      # XML, no stacks. The watchdog notices a test worker that has stopped burning
      # CPU, dumps its threads into the log and build/hang-dumps/, and kills it, so
      # the next hang costs ~3 minutes and arrives with evidence. The step timeout is
      # the backstop for a wedge the watchdog cannot see (a spinning livelock), and
      # is a *step* timeout on purpose: it fails the step and leaves the job alive to
      # run the uploads below.
      - name: Unit tests
        timeout-minutes: 20
        run: sh tools/hang-watchdog.sh ./gradlew testDebugUnitTest --stacktrace

      # Blocking: the stated precondition for that (a known-clean lint state) has
      # been met for a while — lint-baseline.xml is committed and EMPTY, and
      # warningsAsErrors/abortOnError are already on in the build. A non-blocking
      # lint whose rationale says "error count unknown" was stale doctrine.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      # Nothing above compiles src/androidTest: testDebugUnitTest, lintDebug and
      # assembleDebug all skip it, and preflight never mentions it. So the emulator
      # lane -- the migration lane, the one DEVELOPMENT.md calls the truth check --
      # sat uncompilable from 3a2a46f (1 Sep) until the first run that got this far
      # (2 Sep), because a commit replaced an import instead of adding one. This
      # compiles the instrumented sources without needing a device, so the next such
      # edit fails here in a minute rather than in the non-blocking emulator job.
      - name: Instrumented sources compile
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Failures are useless without the report, and Gradle's console output truncates.
      # The raw test-results XML is uploaded alongside it because the HTML report is
      # only generated once the test task finishes: after a hang the XML is the only
      # thing that survives, and the class missing from it is the one that wedged.
      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
            build/hang-dumps/
          retention-days: 14
          if-no-files-found: ignore

      # Room writes the schema JSON during KSP. The v1 baseline is committed, but each
      # migration adds a new file that cannot be hand-authored, because Room derives an
      # identityHash the compiler has to agree with. Publishing it here is how a generated
      # schema gets off a machine with the SDK and into the repo — though no phase gate
      # depends on this artifact: with CI unbilled, the owner's own build is the source.
      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14
          if-no-files-found: warn

      # Lets you sideload a build from any machine without opening Android Studio.
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

  # Non-blocking by design. Written blind while CI had no runner (account
  # billing); it runs now. continue-on-error stays until the lane has earned a
  # gate — emulator jobs flake, and a red that blocks merges on a flake costs
  # more than a red nobody reads. The bar: green on trunk ten runs in a row,
  # then drop the flag. Until then, read the job, not the check.
  instrumented-smoke:
    name: Instrumented smoke (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/trunk' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          # The goldens and the screen passes were recorded on the
          # `temper-tests-api29` profile: 411 dp at 420 dpi, which is the Nexus 5X
          # device definition. The runner's default AVD is 320 px wide at mdpi and
          # failed four tests that never failed on the profile (golden 320×616 for
          # 945×1731, two screens too short to reach their rows).
          profile: Nexus 5X
          disable-animations: true
          # The runner tears the emulator down as soon as the script returns, so
          # the script itself dumps logcat on failure; see the file's header
          # for why it is a file and not an inline `||`.
          script: ./tools/ci-instrumented.sh

      # The assertion text — Compose semantics trees, the golden diff figures,
      # the caught exception — lives in the JUnit XML, not in Gradle's stdout.
      # Print it so a failure can be diagnosed from the job log; the report
      # artifact is not reachable from every network.
      - name: Print instrumented failures
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('app/build/outputs/androidTest-results')
          files = sorted(root.rglob('*.xml')) if root.exists() else []
          if not files:
              print('No instrumented result XML under', root)
          failures = 0
          for path in files:
              for case in ET.parse(path).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      for node in case.findall(kind):
                          failures += 1
                          name = f"{case.get('classname')}.{case.get('name')}"
                          print(f'::group::{kind.upper()} {name}')
                          print(node.get('message') or '')
                          lines = (node.text or '').splitlines()
                          print('\n'.join(lines[:400]))
                          if len(lines) > 400:
                              print(f'... {len(lines) - 400} more lines in the report artifact')
                          print('::endgroup::')
          print(f'{failures} failing test(s) across {len(files)} result file(s)')
          PY

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
