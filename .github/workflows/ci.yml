name: CI

# The safety net. Android Studio remains how the app is built and installed on the
# phone; this exists so a broken commit is caught by something other than memory.
# (A unit test in this repo sat red from the day it was written because nothing ran it.)

on:
  push:
    # Feature branches are included on purpose. Work is pushed here from environments
    # that have no Android SDK and cannot reach Google's Maven, so the branch build is
    # the only thing that ever compiles that code — verifying it only once it reaches
    # main would mean reviewing it blind right up to the merge.
    branches: [main, 'claude/**', 'cursor/**']
  pull_request:
  workflow_dispatch:

# Read-only: this job only needs the source and the ability to upload artifacts.
# Without this the token inherits the repo default, which may still be read-write-all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is fine. Superseding a push to main is NOT — that commit would
  # then never be verified, which is the exact hole this workflow exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Non-blocking on purpose: lint has never run against this project, so its error
      # count is unknown and gating on zero today would just wedge every push. Read the
      # report, fix what matters, then delete continue-on-error to make it a real gate.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      # Failures are useless without the report, and Gradle's console output truncates.
      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      # Room writes the schema JSON during KSP, and app/schemas holds no baseline yet —
      # it cannot be hand-authored, because Room derives an identityHash the compiler has
      # to agree with. Publishing it here is how the v1 baseline gets off a machine with
      # the SDK and into the repo, which every future migration is gated on.
      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14
          if-no-files-found: warn

      # Lets you sideload a build from any machine without opening Android Studio.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
