name: CI

# The safety net. Android Studio remains how the app is built and installed on the
# phone; this exists so a broken commit is caught by something other than memory.
# (A unit test in this repo sat red from the day it was written because nothing ran it.)

on:
  push:
    # Feature branches are included on purpose. Work is pushed here from environments
    # that have no Android SDK and cannot reach Google's Maven, so the branch build is
    # the only thing that ever compiles that code — verifying it only once it reaches
    # trunk would mean reviewing it blind right up to the merge.
    branches: [trunk, 'claude/**', 'cursor/**']
  pull_request:
  workflow_dispatch:

# Read-only: this job only needs the source and the ability to upload artifacts.
# Without this the token inherits the repo default, which may still be read-write-all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is fine. Superseding a push to trunk is NOT — that commit would
  # then never be verified, which is the exact hole this workflow exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Non-blocking on purpose: lint has never run against this project, so its error
      # count is unknown and gating on zero today would just wedge every push. Read the
      # report, fix what matters, then delete continue-on-error to make it a real gate.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      # Failures are useless without the report, and Gradle's console output truncates.
      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      # Room writes the schema JSON during KSP. The v1 baseline is committed, but each
      # migration adds a new file that cannot be hand-authored, because Room derives an
      # identityHash the compiler has to agree with. Publishing it here is how a generated
      # schema gets off a machine with the SDK and into the repo — though no phase gate
      # depends on this artifact: with CI unbilled, the owner's own build is the source.
      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14
          if-no-files-found: warn

      # Lets you sideload a build from any machine without opening Android Studio.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

  # Non-blocking by design. CI on this repo has never been assigned a runner
  # (account billing — see docs/DEVELOPMENT.md), so this job is written blind: it
  # exists so the instrumented smoke starts running the day the owner fixes
  # billing, with zero further changes. continue-on-error keeps it from ever
  # gating a merge, even once it runs — emulator jobs flake.
  instrumented-smoke:
    name: Instrumented smoke (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
