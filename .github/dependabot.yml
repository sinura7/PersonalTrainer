version: 2
updates:
  # Monthly, grouped, so this is one PR to glance at rather than a stream of noise.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*']
    commit-message:
      prefix: deps
    # Signed P4.2–P4.4 matrices refuse these. Cursor reproduced both group PRs
    # on JDK 17 / AGP 8.9.2 / compileSdk 36 (2026-09-02):
    #   #114 androidx — checkDebugAarMetadata: core-ktx 1.19.0, Compose UI 1.12.0
    #     (BOM 2026.08.00), and navigation-compose 2.10.0 each require
    #     compileSdk 37 and AGP >= 9.1.0. Room 2.8 is refused by P4.4
    #     (docs/architecture/persistence-toolchain.md).
    #   #116 kotlin — KSP 2.3.11 will not apply: "minimum supported AGP version
    #     is 8.10.0". Coroutines 1.11.0 is the Kotlin 2.2.20 companion
    #     (docs/architecture/core-toolchain.md). Kotlin 2.4.10 is packet K2,
    #     not a Dependabot PR (docs/REPAIR_PROGRAM.md).
    # Patch updates on the signed minors still open. The compiler train is K2.
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.navigation:navigation-compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room:room-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room:room-ktx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room:room-compiler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room:room-testing"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The kotlin group matches org.jetbrains.kotlinx too. Ignoring core and
      # test but not android is how #174 bundled coroutines 1.11.0 — the
      # Kotlin 2.2.20 companion, refused while we stay on 2.0.21
      # (docs/architecture/core-toolchain.md). #174 was closed unmerged.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # AGP 9.x wants compileSdk 37; 8.9.2 is the official compileSdk-36 pair
      # (docs/architecture/lint-policy.md, sdk36-compatibility.md). #125 bumped
      # to 9.3.2 and was closed unmerged.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # tools/test_policy_move.py asserts "play-services-auth 22 is refused":
      # the static gate fails closed on this bump. #126 was closed unmerged.
      - dependency-name: "com.google.android.gms:play-services-auth"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # J3 signed 15-robolectric-13954326-i7 (API 35, Java 17). The 17- jar
      # is a different SDK; robolectric.properties pins sdk=35 because API 36
      # wants Java 21 (docs/architecture/core-toolchain.md). Any bump also
      # needs a ledger row. #176 was closed unmerged. 4.16.x patches of the
      # Robolectric library itself still open.
      - dependency-name: "org.robolectric:android-all-instrumented"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
