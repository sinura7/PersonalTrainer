version: 2
updates:
  # Monthly, grouped, so this is one PR to glance at rather than a stream of noise.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
