# Robolectric 4.16 ships Android SDK jars through API 36 (Baklava), but its
# API-36 jar requires Java 21 (DefaultSdkProvider maps Baklava -> 21) and this
# project is Java 17: jvmTarget is 17, sourceCompatibility is 17, and all four
# workflows pin JDK 17. Asking for 36 therefore failed every Robolectric class
# at sandbox creation with "Android SDK 36 requires Java 21 (have Java 17)" --
# 59 classes, all of them, every run. API 35 is the newest jar Robolectric 4.16
# supports on Java 17. Raise this to 36 only together with the JDK.
sdk=35
# The android-all-instrumented jar is on the Gradle test classpath and in
# gradle/verification-metadata.xml. Offline stops a second fetch that would
# bypass the ledger.
offline=true
