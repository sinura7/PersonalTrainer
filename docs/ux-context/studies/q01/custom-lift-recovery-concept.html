<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temper · Lift editor recovery concept</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101214;color:#f4f5f6;font:16px system-ui,sans-serif;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:48px;border:0;background:transparent;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #bbff00;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.preview{max-width:680px;margin:24px auto;padding:0 20px}.preview h1{font-size:22px;margin:0 0 6px}.sub{font-size:14px;color:#b0b7bd}.chooser{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.chooser select{background:#23272b;color:inherit;border:1px solid #50585e;padding:12px;border-radius:10px;max-width:100%}.phone{width:min(100%,412px);height:740px;margin:20px auto;background:#080a0b;border:1px solid #353a3f;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}.top{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292e32;gap:12px}.top h2{font-size:25px;line-height:1.2;margin:2px 0}.kicker{font-size:11px;letter-spacing:1.5px;color:#aeb7bc;font-weight:650}.quiet{color:#b9c1c6;font-size:14px;padding:0 8px}.content{flex:1;min-height:0;overflow:auto;padding:20px}.status{padding:12px 0 16px;font-size:14px;color:#c2cbd0;border-bottom:1px solid #30373c;margin-bottom:18px}.status strong{display:block;color:#f4f5f6;margin-bottom:4px}.form{display:grid;gap:18px}.field{display:grid;gap:7px}.field label,.field legend{font-size:12px;letter-spacing:.6px;color:#bec7cc;font-weight:650}.field input,.field textarea,.field select{background:#161a1d;border:1px solid #434c52;border-radius:10px;color:inherit;padding:12px;width:100%;min-height:48px}.field textarea{resize:vertical;min-height:90px}.field input:disabled,.field select:disabled,.field textarea:disabled{color:#c2cbd0;opacity:1}fieldset{border:0;padding:0;margin:0}.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.types button{background:#161a1d;border-radius:8px;padding:8px 12px;font-size:14px;border:1px solid #343c42}.types button[aria-checked=true]{color:#d6ff76;border-color:#baff00;background:#28341c}.types button[aria-checked=true]:before{content:'✓ ';font-weight:bold}.footer{padding:14px 20px 12px;border-top:1px solid #30363a;background:#101416}.primary{width:100%;min-height:60px;background:#baff00;color:#172000;border-radius:12px;font-weight:700;font-size:17px;padding:12px}.primary:disabled{background:#293035;color:#c6cdd1;opacity:1}.secondary{width:100%;font-size:14px;color:#bfc8ce;margin-top:4px}.danger{color:#ff8791}.lift{width:100%;text-align:left;display:block;padding:16px 0;border-bottom:1px solid #2c3237}.lift strong{display:block;font-size:18px}.lift span{display:block;font-size:14px;color:#b6c0c5;margin-top:4px}.empty{padding:22px 0;color:#b6c0c5}.toast{color:#d4ff78;font-size:14px;margin-bottom:18px}.receipt{padding:24px 0}.receipt h3{font-size:24px;margin:0 0 12px;overflow-wrap:anywhere}.receipt p{color:#b9c4ca}.dialog{background:#23292d;border:1px solid #626d74;border-radius:14px;padding:18px;margin:16px 0}.dialog p{font-size:14px;color:#c6cdd1}.dialog button{display:block;width:100%}.hidden{display:none!important}@media(max-width:420px){.preview{padding:0 8px}.phone{border-radius:16px;height:720px}.top,.content{padding-left:16px;padding-right:16px}.footer{padding-left:16px;padding-right:16px}}
</style></head><body>
<main class="preview"><h1>Lift editor · connected concept</h1><div class="sub">Synthetic records. This preview does not save app data or demonstrate Android recovery.</div>
<div class="chooser"><label for="scenario">Preview state</label><select id="scenario"><option value="normal">Normal / empty</option><option value="resume">Resumed draft</option><option value="loading">Loading draft</option><option value="read-error">Draft read unavailable</option><option value="before">Save interrupted before commit</option><option value="after">Save interrupted after commit</option><option value="conflict">Lift changed before recovery</option></select><button id="reset" class="quiet">Reset</button></div>
<section class="phone" aria-label="Temper editor concept"><header class="top"><div><div class="kicker" id="context">TEMPER</div><h2 id="title">Library</h2></div><button class="quiet hidden" id="close">Close</button></header><div class="content" id="content"></div><footer class="footer"><button class="primary" id="primary">New lift</button><button class="secondary hidden" id="secondary"></button></footer></section></main>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const types=['Plates','Stack','Bodyweight','Added','Assisted'];
 const blank=()=>({id:null,name:'',muscle:'Back',notes:'',type:'Plates'});
 let draft=null, records=[], pending=null, state='library', retainedState='editor', notice='', mode='normal', savedId='concept-custom-1', confirm=false, token=0;
 const escape = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function sample(){return {id:null,name:'Chest-supported row',muscle:'Back',notes:'Keep the chest supported.\nUse the handles that feel comfortable.',type:'Stack'};}
 function setMode(){token++;mode=$('scenario').value;records=[];pending=null;notice='';confirm=false;draft=null;state='library';retainedState='editor';if(mode==='resume'){draft=sample();open();}else if(mode==='loading'){draft=sample();state='loading';}else if(mode==='read-error'){draft=sample();state='read-error';}else if(['before','after','conflict'].includes(mode)){draft=sample();state='editor';}render();}
 function open(){if(!draft){draft=blank();notice='';retainedState='editor';}else notice='Draft resumed';state=pending?retainedState:retainedState==='read-error'?'read-error':'editor';confirm=false;render();}
 function render(){
  const editor=['editor','saving','uncertain','retryable','conflict','read-error','loading'].includes(state);
  $('context').textContent=state==='library'?'TEMPER':state==='receipt'?'SAVED LIFT':state==='record'?'LIBRARY LIFT':'CUSTOM LIFT';
  $('title').textContent=state==='library'?'Library':state==='receipt'?'Saved':state==='record'?'Current lift':draft&&draft.id?'Edit lift':'New lift';
  $('close').classList.toggle('hidden',!editor);$('close').disabled=state==='saving';$('primary').disabled=false;$('secondary').classList.add('hidden');
  if(state==='library'){
   $('content').innerHTML=(notice?`<div class="toast" role="status">${escape(notice)}</div>`:'')+(draft?'<button class="lift" id="resume"><strong>Resume lift draft</strong><span>Your unfinished fields are kept.</span></button>':'')+(records.length?records.map(r=>`<button class="lift" data-edit="${r.id}"><strong>${escape(r.name)}</strong><span>${escape(r.muscle)} · ${r.type}</span></button>`).join(''):'<div class="empty">No custom lifts yet.</div>');
   $('primary').textContent='New lift';$('primary').onclick=open;if($('resume'))$('resume').onclick=open;
   document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{if(pending){state='record';render();return;}draft={...records.find(r=>r.id===b.dataset.edit)};pending=null;notice='';state='editor';render();});return;
  }
  if(state==='receipt'||state==='record'){$('content').innerHTML=`<div class="receipt"><h3>${escape(records[records.length-1].name)}</h3><p>${escape(records[records.length-1].muscle)} · ${records[records.length-1].type}</p><p>${escape(records[records.length-1].notes).replace(/\n/g,'<br>')}</p><div class="toast" role="status">${state==='receipt'?'Saved once to your Library.':'Current saved values. Your unfinished draft is retained.'}</div></div>`;$('primary').textContent='Done';$('primary').onclick=()=>{state='library';render();};return;}
  const frozen=state!=='editor';
  const statuses={loading:['Opening draft…','Your saved fields are being read.'], 'read-error':['Draft unavailable','Your fields have not been discarded. Check again before saving.'],saving:['Saving lift…','Keep this result while the save is being confirmed.'],uncertain:['Save not confirmed','Your values are retained. Check what saved before trying again.'],retryable:['Not saved yet','Nothing from this command committed. Retry keeps the same values.'],conflict:['Lift changed','Your draft is retained. Review the current lift before making another change.']};
  let status=statuses[state];if(!status&&notice)status=[notice,'Close keeps this draft. Discard removes only unfinished fields.'];
  $('content').innerHTML=(status?`<div class="status" role="status"><strong>${status[0]}</strong>${status[1]}</div>`:'')+`<form class="form" id="form"><div class="field"><label for="name">NAME</label><input id="name" value="${escape(draft.name)}" ${frozen?'disabled':''}></div><div class="field"><label for="muscle">MUSCLE GROUP</label><select id="muscle" ${frozen?'disabled':''}>${['Back','Chest','Quads','Hamstrings','Shoulders','Biceps','Triceps','Other'].map(m=>`<option ${m===draft.muscle?'selected':''}>${m}</option>`).join('')}</select></div><fieldset class="field"><legend>LOAD TYPE</legend><div class="types" role="radiogroup" aria-label="Load type">${types.map(t=>`<button type="button" role="radio" aria-checked="${t===draft.type}" data-type="${t}" ${frozen?'disabled':''}>${t}</button>`).join('')}</div></fieldset><div class="field"><label for="notes">NOTES · OPTIONAL</label><textarea id="notes" ${frozen?'disabled':''}>${escape(draft.notes)}</textarea></div></form>`;
  if(confirm)$('content').insertAdjacentHTML('beforeend','<div class="dialog" role="alertdialog" aria-label="Discard draft"><strong>Discard this draft?</strong><p>Only unfinished fields are removed. Any lift already saved remains saved.</p><button id="keep">Keep draft</button><button id="discard" class="danger">Discard draft</button></div>');
  $('form').onsubmit=e=>e.preventDefault();$('name').oninput=e=>{draft.name=e.target.value;ready();};$('notes').oninput=e=>draft.notes=e.target.value;$('muscle').onchange=e=>draft.muscle=e.target.value;
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{draft.type=b.dataset.type;render();});
  $('primary').textContent=state==='loading'?'Opening…':state==='saving'?'Saving…':state==='read-error'?'Check again':state==='uncertain'?'Check save':state==='retryable'?'Retry save':state==='conflict'?'Review current lift':draft.id?'Save changes':'Create lift';
  $('primary').disabled=['loading','saving'].includes(state)||(state==='editor'&&!draft.name.trim());
  $('primary').onclick=state==='uncertain'?inspect:state==='retryable'?save:state==='read-error'?()=>{state='editor';notice='Draft resumed';render();}:state==='conflict'?()=>{retainedState=state;state='library';notice='Draft retained. Review the saved lift from the Library.';render();}:save;
  if(!['loading','saving'].includes(state)){$('secondary').classList.remove('hidden');$('secondary').textContent='Discard draft';$('secondary').onclick=()=>{confirm=true;render();};}
  if(confirm){$('keep').onclick=()=>{confirm=false;render();};$('discard').onclick=()=>{draft=null;pending=null;confirm=false;notice='Draft discarded';state='library';render();};}
 }
 function ready(){if(state==='editor')$('primary').disabled=!draft.name.trim();}
 function save(){if(state==='saving'||!draft.name.trim())return;if(!pending)pending={...draft,id:draft.id||savedId,name:draft.name.trim(),notes:draft.notes.trim()};state='saving';confirm=false;render();const admitted=token;setTimeout(()=>{if(admitted!==token)return;if(['after','conflict'].includes(mode))commit();if(mode==='conflict'&&records.length)records[records.length-1]={...records[records.length-1],name:'Row · changed elsewhere'};if(['before','after','conflict'].includes(mode)){state='uncertain';render();}else{commit();settle();}},600);}
 function commit(){const index=records.findIndex(r=>r.id===pending.id);if(index<0)records.push({...pending});else records[index]={...pending};}
 function inspect(){const existing=records.find(r=>r.id===pending.id);if(existing&&JSON.stringify(existing)===JSON.stringify(pending))settle();else{state=existing?'conflict':'retryable';if(state==='retryable')mode='normal';render();}}
 function settle(){draft=null;pending=null;notice='Lift saved';state='receipt';render();}
 $('close').onclick=()=>{if(state==='saving')return;retainedState=state;state='library';notice='Draft kept';confirm=false;render();};$('scenario').onchange=setMode;$('reset').onclick=setMode;setMode();
})();
</script></body></html>
