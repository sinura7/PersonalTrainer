<script>
(() => {
  const root = document.getElementById('temper-quiet-workout');
  if (!root) return;
  const SCHEMA = 3;
  const MAX_COMPARISON_SETS=12;
  const instanceToken = `tw-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const exercises = ['Incline Dumbbell Bench Press', 'Seated Cable Row'];
  const viewNames = ['home','workout','rest','exercises','edit','finish','summary','history','detail','why'];
  const appearance = { textScale: 1 };
  const probes = { failNextWrite: false, saveSpeed: 'Normal' };
  const states = {};
  const controllers = {};
  let layoutQueued=false;
  function matchStageHeights() {
    layoutQueued=false;
    const stages=Array.from(root.querySelectorAll(':scope > [data-variant]'));
    const width=root.getBoundingClientRect().width;
    let height=0;
    for(const stage of stages) {
      const hidden=stage.hidden;
      const oldStyle=stage.getAttribute('style');
      if(hidden) {
        stage.style.visibility='hidden';stage.style.position='absolute';stage.style.width=`${width}px`;
        stage.hidden=false;
      }
      const style=getComputedStyle(stage);
      height=Math.max(height,stage.querySelector('.tw-phone').getBoundingClientRect().height+parseFloat(style.paddingTop)+parseFloat(style.paddingBottom));
      if(hidden)stage.hidden=true;
      if(oldStyle===null)stage.removeAttribute('style');else stage.setAttribute('style',oldStyle);
    }
    for(const stage of stages)stage.style.minHeight=`${Math.ceil(height)}px`;
  }
  function queueLayout() {
    if(layoutQueued)return;
    layoutQueued=true;requestAnimationFrame(matchStageHeights);
  }
  const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const now = () => Date.now();
  const clone = x => JSON.parse(JSON.stringify(x));
  const freshDraft = () => ({ weight: '60', reps: '8', effort: null, dirty: false });
  const fresh = () => ({ view:'home', active:false, completed:false, exercise:0, onlySaved:false, planned:[3,3], drafts:[freshDraft(),freshDraft()], saved:[], nextId:1, startedAt:null, endedAt:null, rest:null, edit:null, pending:null, failed:null, undo:null, notice:'', busy:false });
  function validDraft(d) {
    const a = d && typeof d === 'object' ? d : {};
    return { weight:typeof a.weight === 'string' && a.weight.length < 18 ? a.weight : '60', reps:typeof a.reps === 'string' && a.reps.length < 10 ? a.reps : '8', effort:[6,7,8,9,10].includes(a.effort) ? a.effort : null, dirty:a.dirty === true };
  }
  function restoreOne(value) {
    const s = fresh();
    if (!value || typeof value !== 'object') return s;
    s.view = viewNames.includes(value.view) ? value.view : 'home';
    s.active = value.active === true;
    s.completed = value.completed === true;
    s.exercise = value.exercise === 1 ? 1 : 0;
    s.onlySaved = value.onlySaved === true;
    s.planned = [0,1].map(i => Number.isInteger(value.planned?.[i]) && value.planned[i] >= 3 && value.planned[i] <= MAX_COMPARISON_SETS-3 ? value.planned[i] : 3);
    if(s.planned[0]+s.planned[1]>MAX_COMPARISON_SETS)s.planned=[3,3];
    s.drafts = [validDraft(value.drafts?.[0]), validDraft(value.drafts?.[1])];
    s.saved = Array.isArray(value.saved) ? value.saved.filter(r => r && Number.isInteger(r.id) && r.id > 0 && [0,1].includes(r.exercise) && Number.isFinite(r.weight) && r.weight >= 0 && Number.isInteger(r.reps) && r.reps > 0 && [6,7,8,9,10].includes(r.effort)).map(r => ({id:r.id,exercise:r.exercise,weight:r.weight,reps:r.reps,effort:r.effort,at:Number.isFinite(r.at)?r.at:now()})) : [];
    s.nextId = Math.max(1, Number.isSafeInteger(value.nextId)?value.nextId:1, ...s.saved.map(r => r.id + 1));
    s.startedAt = Number.isFinite(value.startedAt) ? value.startedAt : null;
    s.endedAt = Number.isFinite(value.endedAt) ? value.endedAt : null;
    if (value.rest && Number.isFinite(value.rest.deadline) && Number.isFinite(value.rest.duration) && value.rest.duration > 0 && Number.isInteger(value.rest.sourceId)) s.rest = {deadline:value.rest.deadline,duration:value.rest.duration,sourceId:value.rest.sourceId,status:['running','complete','skipped'].includes(value.rest.status)?value.rest.status:'running'};
    if (value.edit && s.saved.some(r => r.id === value.edit.id)) s.edit = {id:value.edit.id,draft:validDraft(value.edit.draft)};
    if (value.undo && s.saved.some(r => r.id === value.undo.id)) {
      if(value.undo.kind==='new') s.undo={kind:'new',id:value.undo.id};
      if(value.undo.kind==='edit') {
        const r=value.undo.previous;
        if(r && r.id===value.undo.id && [0,1].includes(r.exercise) && Number.isFinite(r.weight) && r.weight>=0 && Number.isInteger(r.reps) && r.reps>0 && [6,7,8,9,10].includes(r.effort)) s.undo={kind:'edit',id:value.undo.id,previous:{id:r.id,exercise:r.exercise,weight:r.weight,reps:r.reps,effort:r.effort,at:Number.isFinite(r.at)?r.at:now()}};
      }
    }
    if (!s.active && !s.completed && !['home','history'].includes(s.view)) s.view = 'home';
    if (s.view === 'edit' && !s.edit) s.view = s.active ? 'workout' : 'detail';
    if (s.completed && ['workout','rest','exercises','edit','finish','why'].includes(s.view)) s.view = 'summary';
    if (value.failed && ['new','edit'].includes(value.failed.kind)) {
      const p = value.failed.payload;
      if (p && [0,1].includes(p.exercise) && Number.isFinite(p.weight) && p.weight >= 0 && Number.isInteger(p.reps) && p.reps > 0 && [6,7,8,9,10].includes(p.effort)) s.failed = {kind:value.failed.kind,payload:{exercise:p.exercise,weight:p.weight,reps:p.reps,effort:p.effort},id:Number.isInteger(value.failed.id)?value.failed.id:null};
    }
    if (value.pending && !s.failed) {
      const p = value.pending;
      if (p && ['new','edit'].includes(p.kind) && p.payload) {
        const temp = restoreOne({active:s.active,failed:p});
        s.failed = temp.failed;
        if (s.failed) s.notice = 'This set was not saved. Retry when you are ready.';
      }
    }
    return s;
  }
  function restore(snapshot) {
    const p = snapshot?.privateContent;
    if (p?.schema !== SCHEMA) return false;
    for (const key of ['quiet','context']) states[key] = restoreOne(p.variants?.[key]);
    appearance.textScale = Number.isFinite(p.appearance?.textScale) ? Math.min(2,Math.max(1,p.appearance.textScale)) : 1;
    probes.saveSpeed = ['Normal','Slow'].includes(p.probes?.saveSpeed) ? p.probes.saveSpeed : 'Normal';
    probes.failNextWrite = p.probes?.failNextWrite === true;
    return true;
  }
  if (!restore(window.openai?.widgetState)) { states.quiet = fresh(); states.context = fresh(); }
  function persist() {
    const variants = {};
    for (const key of ['quiet','context']) {
      const s = states[key];
      variants[key] = {view:s.view,active:s.active,completed:s.completed,exercise:s.exercise,onlySaved:s.onlySaved,planned:s.planned,drafts:s.drafts,saved:s.saved,nextId:s.nextId,startedAt:s.startedAt,endedAt:s.endedAt,rest:s.rest,edit:s.edit,pending:s.pending,failed:s.failed,undo:s.undo};
    }
    const snapshot = {
      modelContent:{concept:'Temper connected workout proposals',baseline:'Owner uses Debug 124',variants:Object.fromEntries(['quiet','context'].map(key => [key,{screen:states[key].view,savedSets:states[key].saved.length,finished:states[key].completed,exercise:exercises[states[key].exercise],draft:states[key].drafts[states[key].exercise],volumeLb:volume(states[key]),lastSaved:states[key].saved.at(-1)??null}]))},
      privateContent:{schema:SCHEMA,origin:instanceToken,variants,appearance:clone(appearance),probes:clone(probes)}
    };
    if (JSON.stringify(snapshot).length > 15000) {
      for(const key of ['quiet','context']){
        states[key].notice='This comparison reached its recovery limit. Keep this view open to inspect your entries.';
        render(key);
      }
      return;
    }
    if (window.openai?.setWidgetState) Promise.resolve(window.openai.setWidgetState(snapshot)).catch(() => {});
  }
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (action, label, cls='', extra='') => `<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${extra}>${label}</button>`;

      s.notice='Set saved. Select effort for your next set.';
    } else {
      const index=s.saved.findIndex(r=>r.id===op.id);
      if(index<0){s.failed=op;s.notice='This saved set could not be found.';render(key);persist();return;}
      const old=clone(s.saved[index]);
      s.saved[index]={...old,...op.payload};
      s.undo={kind:'edit',id:old.id,previous:old};s.edit=null;s.view='workout';s.notice='Correction saved to the same set.';
    }
    s.failed=null;render(key);persist();
  }
  function undo(key) {
    const s=states[key], op=s.undo;
    if(!op||s.busy||!s.active)return;
    const i=s.saved.findIndex(r=>r.id===op.id);
    if(i<0)return;
    if(op.kind==='new') {
      s.saved.splice(i,1);
      if(s.rest?.sourceId===op.id)s.rest=null;
      s.notice='Saved set removed. Your current entry is kept.';
    } else {s.saved[i]=clone(op.previous);s.notice='Saved set restored to its previous result.';}
    s.undo=null;render(key);persist();
  }
  function adjustRest(key,delta) {
    const s=states[key];
    if(s.busy||s.rest?.status!=='running')return;
    s.rest.deadline+=delta;
    if(delta>0)s.rest.duration+=delta;
    if(s.rest.deadline<=now()){s.rest.status='complete';s.notice='Rest complete. You can keep working out.';}
    render(key);persist();
  }
  function tick() {
    let changed=false;
    for(const key of ['quiet','context']) {
      const s=states[key], c=controllers[key];
      if(!s.rest||s.rest.status!=='running')continue;
      const ms=remaining(s);
      if(ms<=0){s.rest.status='complete';s.notice='Rest complete. You can keep working out.';render(key);changed=true;continue;}
      c.screen.querySelectorAll('[data-rest-time]').forEach(el=>{el.textContent=time(ms);});
      const ring=c.screen.querySelector('[data-timer-ring]');
      if(ring)ring.setAttribute('stroke-dashoffset',String(917.35*(1-Math.min(1,ms/s.rest.duration))));
    }
    if(changed)persist();
  }
  function act(key,action,buttonEl) {
    const s=states[key];
    if(s.busy)return;
    if(action==='start'){start(key);return;}
    if(action==='log'){write(key,false);return;}
    if(action==='save-edit'){write(key,true);return;}
    if(action==='undo'){undo(key);return;}
    if(action==='apply'||action==='apply-return'){applySuggestion(key,action==='apply-return');return;}
    if(action==='minus-rest'||action==='plus-rest'){adjustRest(key,action==='minus-rest'?-15000:15000);return;}
    if(action==='skip-rest'){
      if(s.rest){s.rest.status='skipped';s.rest.deadline=now();}
      if(s.view==='rest')s.view='workout';
      s.notice='Rest skipped. Your workout is still in progress.';render(key);persist();return;
    }
    if(action==='edit-failed'){s.failed=null;s.notice='Your entry is ready to edit.';render(key);persist();return;}
    if(action==='edit') {
      const row=s.saved.find(r=>r.id===Number(buttonEl.dataset.id));
      if(!row)return;
      s.edit={id:row.id,draft:{weight:String(row.weight),reps:String(row.reps),effort:row.effort,dirty:false}};s.failed=null;s.view='edit';s.notice='';render(key);persist();return;
    }
    if(action==='cancel-edit'){s.edit=null;s.failed=null;setView(key,'workout');return;}
    if(action==='saved'){s.onlySaved=true;s.view='exercises';s.notice='';render(key);persist();return;}
    if(action==='choose-exercise'||action==='next-exercise') {
      s.exercise=action==='next-exercise'?(s.exercise===0?1:0):Number(buttonEl.dataset.value);
      s.failed=null;s.view='workout';s.onlySaved=false;s.notice='Exercise opened. Your other entry is kept.';render(key);persist();return;
    }
    if(action==='extra'){if(totalPlanned(s)>=MAX_COMPARISON_SETS)return;s.planned[s.exercise]+=1;s.notice='Extra working set added.';render(key);persist();return;}
    if(action==='confirm-finish') {
      s.active=false;s.completed=true;s.endedAt=now();s.rest=null;s.undo=null;s.failed=null;s.edit=null;s.view='summary';s.notice='Saved sets are in your workout history.';render(key);persist();return;
    }
    if(action==='finish') {s.failed=null;setView(key,'finish');return;}
    if(action==='effort'||action==='edit-effort') {
      const draft=action==='edit-effort'?s.edit?.draft:s.drafts[s.exercise];
      if(!draft)return;
      draft.effort=Number(buttonEl.dataset.value);draft.dirty=true;s.failed=null;s.notice='';render(key);persist();return;
    }
    const match=action.match(/^(edit-)?(weight|reps)-(minus|plus)$/);
    if(match) {
      const draft=match[1]?s.edit?.draft:s.drafts[s.exercise];if(!draft)return;
      const field=match[2], step=field==='weight'?2.5:1;
      const current=Number(String(draft[field]).replace(',','.'));
      draft[field]=String(Math.round(Math.max(field==='weight'?0:1,(Number.isFinite(current)?current:0)+(match[3]==='minus'?-step:step))*100)/100);
      draft.dirty=true;s.failed=null;s.notice='';render(key);persist();return;
    }
    if(action==='done'||action==='nav-home'||action==='home'){setView(key,'home');return;}
    if(action==='nav-history'||action==='history'){setView(key,'history');return;}
    if(['workout','rest','exercises','detail','why'].includes(action)){setView(key,action);}
  }
  for(const key of ['quiet','context']) {
    const phone=root.querySelector(`[data-product="${key}"]`);
    const screen=phone.querySelector('[data-screen]');
    controllers[key]={phone,screen};
    screen.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(key,b.dataset.action,b);});
    screen.addEventListener('input',e=>{
      const input=e.target.closest('input[data-field]');if(!input||states[key].busy)return;
      const s=states[key], edit=input.dataset.field.startsWith('edit-');
      const field=input.dataset.field.replace(/^edit-/,'');
      const draft=edit?s.edit?.draft:s.drafts[s.exercise];if(!draft)return;
      draft[field]=input.value;draft.dirty=true;s.failed=null;s.notice='';render(key);persist();
    });
  }
  renderAll();
  new ResizeObserver(queueLayout).observe(root);
  tick();
  const timer=setInterval(tick,500);
  window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
  window.addEventListener('openai:set_globals',e=>{
    if(!e.detail?.globals||!Object.prototype.hasOwnProperty.call(e.detail.globals,'widgetState'))return;
    if(e.detail.globals.widgetState?.privateContent?.origin===instanceToken)return;
    if(restore(e.detail.globals.widgetState)){renderAll();tick();}
  });
  if(globalThis.Tweak) {
    const design=new Tweak({container:root,onChange:()=>{renderAll();persist();}});
    design.addSlider(appearance,'textScale',{label:'Text size',min:1,max:2,step:.1,unit:'×',reference:'appearance.textScale'});
    design.addSelect(probes,'saveSpeed',{label:'Save response',options:['Normal','Slow'],reference:'probes.saveSpeed'});
    design.addToggle(probes,'failNextWrite',{label:'Fail next save',reference:'probes.failNextWrite'});
  }
})();
</script>
